<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1f232b"/>
      <stop offset="1" stop-color="#121418"/>
    </linearGradient>
    <linearGradient id="neck" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5ff0c4"/>
      <stop offset="1" stop-color="#20b28a"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <rect x="16.5" y="16.5" width="479" height="479" rx="111.5" fill="none" stroke="#2c313b" stroke-width="3"/>
  <!-- três cabeças/branches que se juntam num tronco, como um grafo de merge -->
  <g fill="none" stroke="url(#neck)" stroke-width="34" stroke-linecap="round">
    <path d="M150 420V112"/>
    <path d="M256 420V184"/>
    <path d="M362 420V112"/>
    <path d="M150 184c0 78 106 60 106 150"/>
    <path d="M362 184c0 78-106 60-106 150"/>
  </g>
  <g fill="#15171c" stroke="#5ff0c4" stroke-width="14">
    <circle cx="150" cy="112" r="30"/>
    <circle cx="256" cy="184" r="30"/>
    <circle cx="362" cy="112" r="30"/>
  </g>
</svg>
